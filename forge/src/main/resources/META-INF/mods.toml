modLoader = "javafml"
loaderVersion = "[43,)"
license = "MIT"

[[mods]]
modId = "placeonpath"
version = "${version}"
displayName = "PlaceOnPath"
authors = "Maxi"
description = '''
Lets you place any block on dirt path blocks without turning them into dirt, and swaps the path for a full-height variant so there is no gap to the block on top.
'''

[[dependencies.placeonpath]]
modId = "forge"
type = "required"
versionRange = "[43,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.placeonpath]]
modId = "minecraft"
type = "required"
versionRange = "[1.19.2,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.placeonpath]]
modId = "architectury"
type = "required"
versionRange = "[6.6.92,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "placeonpath.mixins.json"

type = "required"
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.placeonpath]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.placeonpath]]
modId = "architectury"
type = "required"
versionRange = "[13.0.8,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "placeonpath.mixins.json"

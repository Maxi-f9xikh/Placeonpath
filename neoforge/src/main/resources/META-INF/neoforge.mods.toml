[[mods]]
modId = "placeonpath"
version = "${version}"
displayName = "PlaceOnPath"
authors = "Maxi"
description = '''
Lets you place any block on dirt path blocks without turning them into dirt, and swaps the path for a full-height variant so there is no gap to the block on top.
'''
#logoFile = ""

[[dependencies.placeonpath]]
